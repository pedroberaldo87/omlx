              - text: O pior caso ocorre quando cada escolha de pivô deixa as partições sistematicamente desequilibradas — típico com pivô fixo (primeiro/último elemento) numa entrada já ordenada ou quase ordenada, ou pivô que cai sempre numa extremidade — reduzindo a profundidade recursiva de O(log n) para O(n) e o custo de O(n log n) para O(n²).
            - paragraph [ref=f11e1047]:
              - strong [ref=f11e1048]: "Como evitar:"
              - text: Na prática, escolhe-se o pivô aleatoriamente (randomized quicksort) ou via median-of-three/median-of-nine, e bibliotecas usam híbridos como introsort — quicksort com fallback para heapsort/insertion sort — que tornam o pior caso garantido O(n log n).
