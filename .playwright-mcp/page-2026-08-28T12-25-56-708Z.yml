      - heading "O que foi testado, e como" [level=2] [ref=f4e23]
    - paragraph [ref=f4e24]: O plano ligou quatro mecanismos novos no motor de geração, um por vez, e mediu cada um contra a configuração de produção.
    - list [ref=f4e25]:
      - listitem [ref=f4e26]:
        - strong [ref=f4e27]: MTP
        - text: (Multi-Token Prediction) — módulo do modelo que palpita vários tokens à frente; o modelo confere e só aceita o que ele mesmo geraria.
      - listitem [ref=f4e28]:
        - text: Junto do MTP roda a
        - strong [ref=f4e29]: cópia de histórico
        - text: ": quando o texto recente já apareceu antes, o que veio depois daquela vez vira o palpite."
      - listitem [ref=f4e30]:
        - strong [ref=f4e31]: Cadeia
        - text: — a cópia cresce token a token e pode emendar a continuação de uma aparição com a de outra, em vez de copiar um bloco único.
      - listitem [ref=f4e32]:
        - strong [ref=f4e33]: Histerese
        - text: — quantos tokens o MTP palpita por vez (a profundidade) sobe um degrau após acertos cheios seguidos e desce a cada erro.
      - listitem [ref=f4e34]:
        - strong [ref=f4e35]: Freio paciente
        - text: — só zera a memória da cópia após 5 rodadas ruins seguidas, no lugar de congelar regiões após 2 falhas.
      - listitem [ref=f4e36]:
        - strong [ref=f4e37]: Margem
        - text: — a cópia só palpita quando a continuação dominante aparece 2 vezes mais que as rivais somadas; entrada ambígua fica calada.
    - list [ref=f4e38]:
      - listitem [ref=f4e39]: "Cada medição é um A/B: a mesma carga roda com o mecanismo ligado e desligado, alternando lado a lado (A,B,A,B) para diluir o aquecimento."
      - listitem [ref=f4e40]:
        - strong [ref=f4e41]: Repetido
        - text: — reescrever um código que já está no prompt; o texto a gerar já apareceu antes, o cenário ideal da cópia.
      - listitem [ref=f4e42]:
        - strong [ref=f4e43]: Inédito
        - text: — escrever uma história nova; não há nada para copiar, e o cenário mede o custo do mecanismo quando ele não ajuda.
      - listitem [ref=f4e44]: "A régua de adoção: o ganho segue positivo no repetido mesmo descontando 2 vezes a margem de erro da medição, e não regride no inédito."
      - listitem [ref=f4e45]: Foram 24 pares de medição por mecanismo, somando duas rodadas; a segunda também gravou a telemetria de cada lado.
